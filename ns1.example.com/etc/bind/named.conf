options {
    directory "/var/cache/bind"; // Директория для хранения файлов зоны и других временных файлов

    listen-on { any; }; // Слушаем на всех интерфейсах IPv4
    listen-on-v6 { none; }; // Отключаем прослушивание на IPv6

    allow-query { any; }; // Разрешаем запросы от всех источников

    recursion no; // Отключаем рекурсию, сервер работает только в режиме авторитетных ответов

    dnssec-validation auto; // Включаем автоматическую валидацию DNSSEC

    auth-nxdomain no; // Соответствие стандарту RFC1035
};

// Конфигурация корневой зоны (поддержка корневых серверов)
zone "." IN {
    type hint;
    file "/usr/share/dns/root.hints"; // Файл с корневыми серверами
};

// Конфигурация зоны example.com
zone "example.com" IN {
    type master; // ns1 является мастером для зоны
    file "/etc/bind/master/example.com.zone"; // Путь к файлу зоны
    allow-transfer { 172.28.2.2; 172.28.3.3; }; // Разрешаем передачу зоны ns2 и ns3
    notify yes; // Отправляем уведомления о передаче зоны
};

// Конфигурация зоны example.ru (если это необходимо)
zone "example.ru" IN {
    type master; // ns1 является мастером для зоны
    file "/etc/bind/master/example.ru.zone"; // Путь к файлу зоны
    allow-transfer { 172.28.2.2; 172.28.3.3; }; // Разрешаем передачу зоны на ns2 и ns3
    notify yes; // Отправляем уведомления о передаче зоны
};

// Включаем управление через rndc
include "/etc/bind/rndc.key";

// Управление сервером через rndc
controls {
    inet 127.0.0.1 port 953; // Управление доступно только с localhost
    allow { 127.0.0.1; }; // Разрешаем доступ только с localhost
    keys { "rndc-key"; }; // Указываем ключ для авторизации
};