options {
    directory "/var/cache/bind";

    // Слушаем на всех интерфейсах IPv4
    listen-on { any; };
    listen-on-v6 { none; }; // Отключаем прослушивание на IPv6

    allow-query { any; }; // Разрешаем запросы от всех источников

    recursion no; // Отключаем рекурсию, сервер работает только в режиме авторитетных ответов

    dnssec-validation auto; // Включаем автоматическую валидацию DNSSEC

    auth-nxdomain no; // Соответствие стандарту RFC1035
};

// Настройка корневой зоны
zone "." {
    type hint;
    file "/usr/share/dns/root.hints";
};

// Зона example.com (слейв для ns1)
zone "example.com" {
    type slave;
    file "/var/cache/bind/slaves/db.example.com";
    masters { 172.28.1.1; }; // IP адрес ns1
    notify no;
};

// Зона example.ru (слейв для ns1)
zone "example.ru" {
    type slave;
    file "/var/cache/bind/slaves/db.example.ru";
    masters { 172.28.1.1; }; // IP адрес ns1
    notify no;
};

// Зона example.net (слейв для ns2)
zone "example.net" {
    type slave;
    file "/var/cache/bind/slaves/db.example.net"; 
    masters { 172.28.2.2; }; // IP адрес ns2
    notify no;
};

// Включаем ключ rndc для управления сервером
include "/etc/bind/rndc.key";

// Конфигурация для управления сервером через rndc
controls {
    inet 127.0.0.1 port 953
    allow { 127.0.0.1; } // Управление доступно только с localhost
    keys { "rndc-key"; }; // Ключ для авторизации
};
